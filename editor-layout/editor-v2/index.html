<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Editor v2 · GiaoAn AI — mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--blue:#2563eb;--blue-h:#1d4ed8;--blue-s:#eff6ff;--blue-b:#bfdbfe;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;--green:#059669;--gs:#ecfdf5;--gb:#a7f3d0;--amber:#d97706;--as:#fffbeb;--ab:#fde68a;--red:#dc2626}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--g50);color:var(--g800);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.proto{background:#1f2937;color:#e5e7eb;padding:8px 12px;font-size:12px;display:flex;gap:6px;flex-wrap:wrap}.proto button{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid #4b5563;background:#374151;color:#fff;font-size:12px}.proto button[aria-pressed=true]{background:var(--blue)}
html.bare .proto{display:none}
/* top bar */
.top{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;background:#fff;border-bottom:1px solid var(--g200);font-size:14px}
.ib{min-height:44px;min-width:44px;padding:0 10px;border:0;background:transparent;border-radius:8px;color:var(--g700);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{background:var(--g100)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.logo{width:24px;height:24px;border-radius:6px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.crumb{display:flex;align-items:center;min-width:0;color:var(--g500)}.back-s{text-decoration:none}.crumb a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;color:var(--blue);text-decoration:none;border-radius:6px;white-space:nowrap}
.ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g900);font-weight:600;padding:0 6px}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--g300);background:#fff;color:var(--g800);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-o{border-color:var(--blue-b);color:var(--blue-h);background:var(--blue-s)}
.av{width:32px;height:32px;border-radius:50%;background:var(--blue-s);color:var(--blue-h);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--blue-b)}
.menu{position:absolute;right:8px;top:50px;z-index:50;background:#fff;border:1px solid var(--g200);border-radius:10px;box-shadow:0 8px 24px rgba(17,24,39,.12);padding:6px;min-width:200px}
.menu p{margin:0;padding:8px 10px;font-size:13px;color:var(--g500)}.menu button{display:flex;width:100%;min-height:44px;align-items:center;padding:0 10px;border:0;background:none;border-radius:6px;font-size:15px;color:var(--g800)}
.back-s{display:inline-flex;white-space:nowrap;color:var(--g800);font-weight:500;order:2}.gpl{color:var(--g600);padding:0 6px;white-space:nowrap}.top .brand{flex:1;min-width:0}.top .xw{order:3}#acct{order:4}
.av{width:32px;height:32px}#acct{width:44px;height:44px;padding:0}
.tw{display:flex;align-items:center;gap:8px;margin-bottom:12px}.tw .seg{flex:1;min-width:0;margin:0}.tw .xwp{display:none}
.ws1{display:inline}.ws2{display:none}@media(min-width:360px){.ws1{display:none}.ws2{display:inline}}
.exn .x{margin-left:auto;width:44px;height:44px;border:0;background:transparent;border-radius:8px;font-size:18px;color:var(--g600);cursor:pointer}
.chip.mlc svg{margin-right:6px;vertical-align:-3px}@media(min-width:1100px){.chip.mlc{display:none}}
@media(max-width:720px){.back-s{order:0}.top .brand{order:1}.top .xw{display:none}.tw .xwp{display:inline-flex;padding-left:8px;border-left:1px solid var(--g200)}.tw .xwp .btn{padding:0 12px}.brand .logo,.crumb .home,.crumb .sep,.back-l,.crumb .back-l{display:none}.top{gap:2px}.top .back-s{padding:0 6px}.ttl{padding:0 4px}.back-s{display:inline-flex}.top .btn{padding:0 12px}}
.wrap{display:flex}aside{display:none;width:236px;flex:none;background:#fff;border-right:1px solid var(--g200);padding:16px 12px;min-height:calc(100vh - 52px)}@media(min-width:1100px){aside{display:block}}
aside .t{font-size:14px;color:var(--g700);padding:8px;border-radius:6px}aside .t.on{background:var(--g100);font-weight:600}aside .t.s{font-size:13px;color:var(--g500);padding-left:18px}
main{flex:1;min-width:0;max-width:860px;margin:0 auto;padding:12px 32px 64px}@media(max-width:720px){main{padding:10px 12px 120px}}
/* segmented tabs, all sizes */
.seg{display:inline-flex;max-width:100%;padding:2px;border:1px solid var(--g200);border-radius:10px;background:#fff;margin:0 0 10px}
.seg .tab{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:var(--g600);font-size:14px;font-weight:500;white-space:nowrap}
.seg .tab[aria-selected=true]{background:var(--blue-s);color:var(--blue);font-weight:700;box-shadow:inset 0 0 0 1px var(--blue)}
.seg .s{display:none}
@media(max-width:480px){.seg{display:flex}.seg .tab{flex:1 1 0;min-width:0;padding:0 4px;font-size:13px}.seg .l{display:none}.seg .s{display:inline}}
/* chips */
.chipw{position:sticky;top:52px;z-index:20;background:var(--g50);margin:0 -2px 8px;padding:4px 2px}
@media(min-width:1100px){.chipw{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:13px;color:var(--g600);position:relative}
.chip::before{content:"";position:absolute;inset:6px 0;border:1px solid var(--g200);border-radius:999px;background:#fff;z-index:-1}
.chip{z-index:0}
.chip[aria-current]{color:var(--g900);font-weight:600}.chip[aria-current]::before{background:var(--g100);border-color:var(--g200)}
.chip .w{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}
/* meta */
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 12px;font-size:13px;color:var(--g500)}
.v{border-radius:4px;background:var(--g100);padding:2px 8px;font-size:12px;font-weight:600;color:var(--g700)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px 1px 7px;font-size:12px;font-weight:600;color:var(--g700);border:1px solid var(--gb);background:var(--gs)}.pill i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.pill.am{border-color:var(--ab);background:var(--as)}.pill.am i{background:var(--amber)}
/* SGK bar */
.sgk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:4px 4px 4px 12px;background:#fff;border:1px solid var(--g200);border-left:4px solid var(--amber);border-radius:8px;font-size:15px;color:var(--g800)}
.sgk .tx{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sgk{flex-wrap:nowrap}.sgk .nv .ib{padding:0 8px}.sgk .nv{display:flex;align-items:center;gap:2px}
.sgk .ib{color:var(--blue-h);font-weight:600}.sgk .pos{font-size:13px;color:var(--g500);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
/* card + type scale */
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:20px;margin:0 0 14px}@media(max-width:720px){.card{padding:16px}}
.card>h2{margin:0 0 4px;font-size:18px;font-weight:600;color:var(--g900)}
.sub{margin:0 0 4px;font-size:14px;color:var(--g600)}.sub b{color:var(--g900);font-weight:600}
h3.sh{margin:24px 0 12px;font-size:17px;font-weight:600;color:var(--g900)}
.fld{margin:0 0 14px;position:relative}
.fld label{display:block;margin:0 0 6px;font-size:14px;font-weight:500;color:var(--g600)}
.fld .hint{font-weight:400;color:var(--g500)}
.in,.ta{display:block;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--g300);border-radius:8px;background:#fff;font-size:16px;line-height:1.5;color:var(--g900)}
.ta{resize:none;overflow:hidden;field-sizing:content}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row2{grid-template-columns:1fr}}
.fld.flag{padding-left:12px}.fld.flag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px;background:var(--amber)}
.fld.flag .tag{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12px;font-weight:600;color:#92400e;background:var(--as);border:1px solid var(--ab);border-radius:999px;padding:0 8px;vertical-align:1px}
.fld.cur .ta{border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.18)}
.act{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 4px;border:0;border-top:1px solid var(--g200);background:none;text-align:left;font-size:15px;color:var(--g900)}
.act .c{width:20px;color:var(--g500);transition:transform .15s}.act[aria-expanded=true] .c{transform:rotate(90deg)}
.act b{font-weight:600}.act .nm{flex:1;min-width:0}.act .du{font-size:13px;color:var(--g600);background:var(--g100);border-radius:999px;padding:2px 10px;white-space:nowrap}
.act .w{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.actb{padding:4px 4px 12px 34px}
.step{display:inline-flex;align-items:stretch;border:1px solid var(--g300);border-radius:8px;overflow:hidden}.step button{width:44px;min-height:44px;border:0;background:var(--g50);font-size:20px;color:var(--g700)}
.step input{width:64px;border:0;border-left:1px solid var(--g300);border-right:1px solid var(--g300);text-align:center;font-size:16px}
.step+span{margin-left:8px;font-size:14px;color:var(--g600)}
/* worksheet */
.ws-hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 4px}.ws-hd h2{margin:0;font-size:18px;font-weight:600;color:var(--g900)}.ws-hd .n{font-size:18px;font-weight:600;color:var(--g500)}
.q{border-top:1px solid var(--g200);padding:12px 0}.q:first-of-type{border-top:0}.q b{font-size:15px}.q p{margin:4px 0 0;font-size:15px;color:var(--g800)}.q .an{font-size:14px;color:var(--g600)}
.note{margin:6px 0 0;font-size:13px;color:var(--g500)}
.err{margin:0 0 14px;padding:12px 14px;border:1px solid #fecaca;border-left:4px solid var(--red);background:#fef2f2;border-radius:8px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{position:fixed;right:8px;bottom:8px;z-index:70;background:rgba(17,24,39,.85);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}html:not(.bare) .lbl{display:none}
.empty h3{margin:0 0 4px;font-size:17px;font-weight:600;color:var(--g900)}.empty p{margin:0 0 12px;font-size:15px;color:var(--g700)}

.pill.rd{border-color:#fecaca;background:#fef2f2}.pill.rd i{background:var(--red)}
.sgk.lg .tx{white-space:normal;padding:8px 0}
.blk{margin:0 0 12px;padding:12px 14px;border:1px solid #fecaca;border-left:4px solid var(--red);background:#fef2f2;border-radius:8px;font-size:15px;color:var(--g800);display:flex;flex-direction:column;gap:2px}
.blk b{font-weight:600;color:#991b1b}
.btn-p.xw[aria-disabled=true]{background:var(--g200);border-color:var(--g200);color:var(--g600);cursor:not-allowed}
.tc{margin:18px 0 10px;font-size:15px;font-weight:600;color:var(--g900)}
.regen{margin:24px -20px -20px;padding:16px 20px 20px;border-top:1px solid var(--g200);background:var(--g50);border-radius:0 0 12px 12px}@media(max-width:720px){.regen{margin:24px -16px -16px;padding:16px}}
.rgrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rgrow .note{margin:0;font-size:14px;color:var(--g600)}
.btn:disabled{background:var(--g100);border-color:var(--g200);color:var(--g400);cursor:not-allowed}
.pend{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#92400e;background:var(--as);border:1px solid var(--ab);border-radius:4px;padding:0 6px}
.exn{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px 10px 14px;background:#fff;border:1px solid var(--g200);border-left:4px solid var(--amber);border-radius:8px;font-size:15px;font-weight:600}.exn .a{display:flex;gap:8px}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:78vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:8px 12px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:721px){.sheet{left:auto;top:0;bottom:0;width:340px;max-height:none;border-radius:0}}
.shd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 4px 8px;position:sticky;top:-8px;background:#fff}.shd h2{margin:0;font-size:17px;font-weight:600;color:var(--g900)}.shd .ib{color:var(--blue-h);font-weight:600;font-size:16px}
.ti{display:flex;align-items:center;min-height:48px;padding:0 10px;border-radius:8px;font-size:16px;color:var(--g800);text-decoration:none}.ti.s{min-height:44px;padding-left:24px;font-size:15px;color:var(--g600)}.ti[aria-current]{background:var(--g100);font-weight:600;color:var(--g900)}
.doc{font-size:16px;color:var(--g800);margin:4px 0}ul.doc{padding-left:22px}
</style></head><body>
<div class="proto" id="pb"></div>
<header class="top">
 <div class="brand"><span class="logo" aria-hidden="true">G</span>
  <nav class="crumb" aria-label="Đường dẫn"><a class="home" href="#">GiaoAn AI</a><span class="sep">/</span><span class="back-l gpl">Giáo án</span><span class="sep back-l">/</span><span class="ttl" id="ttl"></span></nav></div>
 <a class="ib back-s" href="#" aria-label="Về danh sách giáo án"><span aria-hidden="true">‹</span><span class="bk"> Danh sách</span></a>
 <button class="btn btn-p xw" type="button" aria-label="Xuất Word">Xuất Word</button>
 <button class="ib" type="button" aria-haspopup="menu" aria-expanded="false" id="acct" aria-label="Tài khoản"><span class="av">L</span></button>
</header>
<div class="wrap"><aside aria-label="Mục lục" id="side"></aside><main id="m"></main></div>
<div class="lbl" id="lbl"></div>
<script>
var Q=new URLSearchParams(location.search);
var V={done:'Đã soạn',toc:'Mục lục mở',xem:'Tab Xem','export-missing':'Thiếu Trường/Tổ/GV',flagged:'Gần SGK','flagged-legacy':'Gần SGK (cũ)',blocked:'Bị chặn','ws-ready':'Phiếu · đã có','ws-blocked':'Phiếu · chưa lưu được','ws-error':'Phiếu · lỗi'};
var view=V[Q.get('view')]?Q.get('view'):'done';if(Q.get('bare')==='1')document.documentElement.classList.add('bare');
var acct=Q.get('acct')==='1';
var TITLE='Đơn thức';
var FLAG=view==='flagged';var FL=['kn','nl2','hd2'];var cur=+(Q.get('f')||0);
var TOC=[['Thông tin bài dạy',0],['I. Mục tiêu',0],['II. Thiết bị dạy học',0],['III. Tiến trình',0],['1. Mở đầu',1],['2. Hình thành kiến thức',1],['3. Luyện tập',1],['4. Vận dụng',1]];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function ta(id,label,lines,hint){var f=FLAG&&FL.indexOf(id)>=0;return '<div class="fld'+(f?' flag':'')+(f&&FL[cur]===id?' cur':'')+'" id="f-'+id+'"><label for="'+id+'">'+label+(hint?' <span class="hint">· '+hint+'</span>':'')+(f?'<span class="tag">Gần SGK</span>':'')+'</label><textarea class="ta" id="'+id+'" rows="'+lines.length+'">'+esc(lines.join('\n'))+'</textarea></div>'}
function inp(id,label,val){return '<div class="fld"><label for="'+id+'">'+label+'</label><input class="in" id="'+id+'" value="'+val+'"/></div>'}
function act(n,name,min,open,flag){var h='<button class="act" type="button" aria-expanded="'+open+'"><span class="c" aria-hidden="true">›</span><span class="nm"><b>Hoạt động '+n+'</b> &nbsp;'+name+'</span>'+(FLAG&&flag?'<span class="w" aria-label="Có đoạn gần SGK"></span>':'')+'<span class="du">'+min+' phút</span></button>';
 if(open)h+='<div class="actb"><div class="fld"><label for="d'+n+'">Thời lượng</label><span class="step"><button type="button" aria-label="Bớt 1 phút">−</button><input id="d'+n+'" inputmode="numeric" pattern="[0-9]*" value="'+min+'"/><button type="button" aria-label="Thêm 1 phút">+</button></span><span>phút</span></div>'+ta('hd'+n,'a) Mục tiêu',['Học sinh nhận ra hai đơn thức đồng dạng qua phần biến.','Thu gọn được tổng các đơn thức đồng dạng.'])+ta('nd'+n,'b) Nội dung',['Học sinh so sánh phần biến của các cặp đơn thức trong bảng.'])+ta('sp'+n,'c) Sản phẩm',['Bảng phân loại đã điền và ví dụ được kiểm tra đúng.'])+'<p class="tc" id="tc'+n+'">d) Tổ chức thực hiện</p>'+ta('gn'+n,'Giao nhiệm vụ',['Giao nhóm hoàn thiện bảng phân loại kèm một ví dụ.'])+ta('th'+n,'Thực hiện nhiệm vụ',['Nhóm điền bảng, thử với hai ví dụ có hệ số khác nhau.'])+ta('bc'+n,'Báo cáo, thảo luận',['Một nhóm đọc bảng; cả lớp đối chiếu và hỏi lại chỗ khác nhau.'])+ta('kl'+n,'Kết luận, nhận định',['Hai đơn thức đồng dạng khi có hệ số khác 0 và cùng phần biến.','Giáo viên chốt cách thu gọn: cộng hệ số, giữ phần biến.'])+'</div>';return h}
var TABS3=Q.get('tabs')!=='4';function tabs(sel){function t(id,l,s){return '<button class="tab" role="tab" id="tab-'+id+'" aria-controls="panel-'+id+'" aria-selected="'+(sel===id)+'" tabindex="'+(sel===id?0:-1)+'" aria-label="'+l+'"><span class="l">'+l+'</span><span class="s" aria-hidden="true">'+s+'</span></button>'}
 return '<div class="seg" role="tablist" aria-label="Chế độ xem">'+t('soan','Soạn','Soạn')+t('xem','Xem như giáo án','Xem')+(TABS3?'':t('diff','So sánh','So sánh'))+t('ws','Phiếu bài tập','Phiếu')+'</div>'}
function chips(){return '<div class="chipw"><div class="chips"><button class="chip mlc" type="button" id="mlc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Mục lục</button>'+TOC.map(function(c,i){var w=FLAG&&(i===1||i===5);return '<button class="chip" type="button"'+(i===0?' aria-current="location"':'')+'>'+c[0]+(w?'<span class="w" aria-label="có đoạn gần SGK"></span>':'')+'</button>'}).join('')+'</div></div>'}
