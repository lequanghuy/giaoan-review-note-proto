<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Editor giáo án · phương án A (đề xuất) · mockup · GiaoAn AI</title>
<style>
/* Tokens: apps/web/src/app/globals.css (:root), same as /retry/new02-qa-fixes */
:root{--blue:#2563eb;--blue-h:#1d4ed8;--blue-s:#eff6ff;--blue-b:#bfdbfe;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;--green:#059669;--amber:#d97706;--as:#fffbeb;--red:#dc2626;--surface:#fff;--line:var(--g200);--card:var(--surface);--focus-ring:0 0 0 3px rgba(37,99,235,.12)}
*{box-sizing:border-box}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,"Noto Sans",sans-serif;background:var(--g50);color:var(--g800);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px;border-radius:4px}

/* ---------- app bar (sticky, 48px, one row so it survives the keyboard) ---------- */
.bar{position:sticky;top:0;z-index:30;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--g200)}
.logo{font-weight:700;font-size:15px;color:var(--blue);white-space:nowrap}
.crumb{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--g600)}
.crumb b{color:var(--g900);font-weight:600}
.toc-btn{display:none;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:0;background:none;color:var(--g700);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--g200);background:#fff;color:var(--g700);font-size:14px;font-weight:500;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff;border:0;box-shadow:0 1px 2px rgba(37,99,235,.25)}
.btn-s{min-height:36px;padding:0 12px;font-size:13px}
/* save slot, approved (icon Thử lại + label), 44px tap area */
.save-slot{display:flex;flex-shrink:0;align-items:center;gap:8px}
.save-label{min-width:5.5rem;text-align:right;font-size:11px;font-weight:500;line-height:1;color:var(--g500)}
.save-label.is-error{color:#92400e}
.save-act{position:relative;width:24px;height:24px;flex:none}
.save-retry{position:relative;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:1px solid #fde68a;border-radius:8px;background:#fff;color:#92400e}
.save-retry svg{width:14px;height:14px}
.save-retry::after{content:"";position:absolute;left:-11px;right:-11px;top:50%;height:44px;transform:translateY(-50%)}

/* ---------- layout ---------- */
.layout{display:flex;align-items:flex-start;justify-content:center;gap:0}
.rail{display:none;position:sticky;top:48px;flex:0 0 236px;align-self:flex-start;max-height:calc(100vh - 48px);overflow:auto;padding:16px 12px 24px;border-right:1px solid var(--g200);background:#fff;min-height:calc(100vh - 48px)}
.rail h6{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g400)}
.ri{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:13px;color:var(--g600)}
.ri.sub{padding-left:26px;min-height:44px;font-size:12px;color:var(--g500)}
.ri.on{background:var(--blue-s);color:var(--blue);font-weight:600}
.ri .n{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:11px;font-weight:700}
.ri .m{margin-left:auto;font-size:11px;color:var(--g400)}
.rail .meta{margin:16px 0 0;padding:10px;border-radius:8px;background:var(--g50);font-size:12px;color:var(--g600)}
.chips{position:sticky;top:48px;z-index:25;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:rgba(249,250,251,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--g200);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--g200);background:#fff;color:var(--g700);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--blue-s);border-color:var(--blue-b);color:var(--blue);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.doc{min-width:0;flex:1;max-width:800px;padding:16px 28px 140px}
.tabs{display:flex;gap:4px;margin:0 0 14px;padding:4px;border-radius:10px;background:var(--g100);width:max-content;max-width:100%}
.tab{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:none;color:var(--g600);font-size:14px;font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{background:#fff;color:var(--g900);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab:disabled{opacity:.45}
.vmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;color:var(--g500)}
.vmeta .v{border-radius:4px;background:var(--g100);padding:1px 8px;font-size:12px;font-weight:600;color:var(--g700)}
@media (min-width:1100px){.rail{display:block}.chips{display:none}.doc{padding:20px 36px 140px}}
@media (max-width:1099px){.toc-btn{display:inline-flex}}
@media (max-width:720px){.doc{padding:12px 12px 140px}.bar{padding:0 8px 0 12px;gap:6px}.crumb{display:none}.save-label{min-width:0}.btn-exp .t{display:none}.logo{font-size:14px}}

/* ---------- editor cards ---------- */
.card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px;margin:0 0 14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.4;color:var(--g900)}
.sec-h small{font-size:12px;font-weight:500;color:var(--g500)}
.lb{display:block;margin:12px 0 6px;font-size:13px;font-weight:500;color:var(--g700)}
.lb:first-child{margin-top:0}
.inp,.ta{width:100%;border-radius:8px;border:1px solid var(--g200);background:#fff;padding:10px 12px;font:inherit;font-size:16px;line-height:1.5;color:var(--g800);outline:none;min-height:44px}
.ta{resize:none;overflow:hidden;min-height:72px;display:block}
.inp:focus,.ta:focus{border-color:var(--blue);box-shadow:var(--focus-ring)}
[aria-invalid=true]{border-color:#d97706}
.field-fail{margin:4px 0 0;font-size:12px;font-weight:500;line-height:1.4;color:#92400e}
.field-fail:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){.two{grid-template-columns:1fr}.card{padding:14px 12px}}
.sum-line{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;font-size:13px;color:var(--g600)}
/* review chips (approved) */
.rv-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:20px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;font-weight:600;line-height:1.4}
.rv-chip svg{color:#b45309}
.rv-done{display:inline-flex;align-items:center;gap:4px;position:relative;padding:2px 10px;min-height:28px;border-radius:20px;background:#fff;border:1px solid #fde68a;color:#334155;font-size:12px;font-weight:600}
.rv-done::after{content:"";position:absolute;inset:-8px -2px}
.rv-done svg{color:#059669}
.rv-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
/* activity accordion */
.act{border:1px solid var(--g200);border-radius:12px;background:#fff;margin:0 0 12px;overflow:hidden;scroll-margin-top:112px}
.act-hd{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 14px;border:0;background:#fff;text-align:left}
.act[data-open=true]>.act-hd{background:var(--g50);border-bottom:1px solid var(--g200)}
.act-n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--blue-s);color:var(--blue);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.act-t{min-width:0;flex:1}
.act-name{margin:0;font-size:15px;font-weight:600;line-height:1.4;color:var(--g900)}
.act-sub{margin:0;font-size:12px;color:var(--g500);display:flex;flex-wrap:wrap;gap:4px 10px}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px;border-radius:14px;background:var(--g100);color:var(--g700);font-size:12px;font-weight:600;white-space:nowrap}
.chev{flex:none;width:20px;height:20px;color:var(--g400);transition:transform .15s}
.act[data-open=true]>.act-hd .chev{transform:rotate(180deg)}
.act-body{display:none;padding:14px}
.act[data-open=true]>.act-body{display:block}
.sub-act{margin:14px 0 0;border:1px solid var(--g200);border-radius:10px;background:#fff;overflow:hidden}
.sub-hd{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:6px 12px;border:0;background:var(--g50);text-align:left;font-size:14px;font-weight:600}
.sub-body{padding:12px}
.d-h{margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--g900)}
.step{margin:0 0 8px}
.step-sum{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 12px;border:1px solid var(--g200);border-radius:8px;background:#fff;text-align:left;font-size:13px}
.step-sum b{flex:none;font-weight:600;color:var(--g700)}
.step-sum span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g500)}
.step-sum svg{margin-left:auto;flex:none;color:var(--g400)}
/* attachments */
.att{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 0}
.att-th{position:relative;display:block;width:88px;height:64px;padding:0;border:1px solid var(--g200);border-radius:8px;background:#fff;overflow:hidden}
.att-th img{width:100%;height:100%;object-fit:contain;display:block}
.att-th .nn{position:absolute;left:4px;top:4px;min-width:18px;height:18px;border-radius:9px;background:rgba(17,24,39,.78);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.att-add{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px dashed var(--g300);border-radius:8px;background:#fff;color:var(--g600);font-size:13px;font-weight:500}
.att-tbl{display:inline-flex;align-items:center;gap:6px;min-height:64px;padding:0 12px;border:1px solid var(--g200);border-radius:8px;background:var(--g50);font-size:12px;color:var(--g700)}
.noalt{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:5px;background:var(--g100);border:1px solid var(--g300);color:var(--g600);display:flex;align-items:center;justify-content:center}
.hint-n{margin:6px 0 0;font-size:12px;color:var(--g600)}
.prop{display:inline-flex;align-items:center;padding:1px 8px;border-radius:10px;border:1px dashed var(--g400);background:#fff;color:var(--g600);font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.propbox{margin:12px 0 0;padding:10px 12px;border:1px dashed var(--g300);border-radius:8px;background:var(--g50);font-size:13px;color:var(--g700)}
.propbox .prop{margin-left:6px}
.propbox p{margin:4px 0 0;font-size:12px;color:var(--g500)}
.upnote{margin:8px 0 0;padding:8px 10px;border:1px dashed var(--g300);border-radius:8px;background:var(--g50);font-size:12px;color:var(--g700)}
.mprev{margin:6px 0 0;padding:6px 10px;border-radius:8px;background:var(--g50);border:1px dashed var(--g300);font-size:15px;color:var(--g800)}
.mprev small{display:block;margin-bottom:2px;font-size:11px;font-weight:600;color:var(--g500)}
math{font-size:1.1em}
.ndv{position:relative;display:inline-block;width:.5em;text-align:center}
.ndv::after{content:"";position:absolute;left:-.1em;right:-.1em;top:.15em;bottom:.1em;background:linear-gradient(to top right,transparent calc(50% - .6px),currentColor calc(50% - .6px),currentColor calc(50% + .6px),transparent calc(50% + .6px))}
.tchip{display:inline-flex;align-items:center;border-radius:4px;border:1px solid var(--g300);background:#fff;padding:1px 8px;font-size:12px;font-weight:600;color:var(--g700)}
.hv-row{display:flex;align-items:flex-start;gap:8px;margin:0 0 8px}
.hv-row .ta{min-height:44px;flex:1}
.hv-x{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--g200);border-radius:8px;background:#fff;color:var(--g600)}
.hv-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 0}
.btn-q{min-height:44px;padding:0 12px;border:0;background:none;color:#991b1b;font-size:13px;font-weight:500}
.hv-empty{margin:0 0 14px;padding:16px;border:1px dashed var(--g300);border-radius:12px;background:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.hv-empty p{margin:0;font-size:13px;color:var(--g500);flex:1;min-width:180px}
.paper ul.hv{margin:2px 0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 0}
.tcard{position:relative;display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 14px;border:1px solid var(--g200);border-radius:12px;background:#fff;text-align:left;font-size:15px;font-weight:600;color:var(--g800)}
.tcard .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--g300);display:flex;align-items:center;justify-content:center;color:#fff}
.tcard[aria-checked=true]{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.tcard[aria-checked=true] .rd{background:var(--blue);border-color:var(--blue)}
.tcard .rd svg{display:none}.tcard[aria-checked=true] .rd svg{display:block}
.thelp{margin:8px 0 0;font-size:13px;color:var(--g600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchips{display:flex;gap:8px;flex-wrap:wrap}
.gch{min-width:56px;min-height:44px;padding:0 16px;border:1px solid var(--g200);border-radius:10px;background:#fff;font-size:15px;font-weight:600;color:var(--g700)}
.gch[aria-pressed=true]{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.create .rail,.create .chips,.create .toc-btn,.create .btn-exp,.create .save-slot{display:none!important}
.create .doc{max-width:720px}
@media (max-width:720px){.cards{grid-template-columns:1fr}}
.tprop{margin:14px 0 0}
.tprop ul{margin:6px 0 0;padding-left:0;list-style:none}
.tprop li{display:flex;gap:8px;padding:4px 0;font-size:13px;color:var(--g700)}
.tprop li b{flex:none;min-width:150px;font-weight:600}
.tprop li.on{color:var(--g900)}
@media (max-width:720px){.tprop li{flex-direction:column;gap:0}.tprop li b{min-width:0}}
.sheet.wide{max-width:720px}
.wrow{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--g100);font-size:13px}
.wrow b{flex:none;min-width:34px;color:var(--g500);font-weight:600}
.wrow span{color:var(--g600)}
.wpaper{margin:10px 0 0;padding:14px 16px;border:1px solid var(--g200);border-radius:4px;background:#fff;font-family:"Times New Roman","Noto Serif",Georgia,serif;font-size:15px;color:#111}
.wpaper h2{margin:0 0 4px;font-size:15px;text-transform:uppercase}
.wpaper ul{margin:2px 0;padding-left:20px}
/* symbol bar above keyboard */
.symbar{display:none;position:fixed;left:0;right:0;z-index:60;height:48px;gap:6px;align-items:center;overflow-x:auto;padding:0 8px;background:#e5e7eb;border-top:1px solid var(--g300);scrollbar-width:none}
.symbar::-webkit-scrollbar{display:none}
.sk{flex:none;min-width:44px;height:40px;padding:0 10px;border:0;border-radius:8px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.25);font-size:18px;color:var(--g900)}
.sk.w{font-size:13px;font-weight:600}
.symsep{flex:none;width:1px;height:24px;background:var(--g300)}
.kbd{display:none;position:fixed;left:0;right:0;bottom:0;z-index:59;background:#d1d3d9;border-top:1px solid #b9bcc4;align-items:center;justify-content:center;color:#6b7280;font-size:12px;letter-spacing:.04em}
body.kbd-on .symbar,body.kbd-on .kbd{display:flex}
body.kbd-on .chips{display:none}
body.kbd-on .doc{padding-bottom:calc(var(--kbd) + 80px)}
/* ---------- action row ---------- */
.acts{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;margin-top:12px}
.act-fail{flex-basis:100%;margin:0;font-size:12px;font-weight:500;line-height:1.4;color:#92400e}
.act-fail:empty{display:none}

/* ---------- "Xem như giáo án" ---------- */
.paper{background:#fff;border:1px solid var(--g200);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:28px 32px;font-family:"Times New Roman","Noto Serif",Georgia,serif;font-size:15px;line-height:1.55;color:#111}
.paper h1{margin:0 0 4px;font-size:18px;text-align:center;text-transform:uppercase}
.paper .sub{margin:0 0 14px;text-align:center;font-size:13px;color:#444}
.paper h2{margin:16px 0 4px;font-size:15px;text-transform:uppercase}
.paper h3{margin:12px 0 2px;font-size:15px}
.paper p{margin:2px 0}
.paper ul{margin:2px 0;padding-left:20px}
.paper .abc{margin:2px 0}
.gv{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px;table-layout:fixed}
.gv th,.gv td{border:1px solid #444;padding:6px 8px;vertical-align:top;text-align:left}
.gv th{background:#f3f4f6;font-family:Inter,system-ui,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
.gv .c1{width:58%}
.gv .sh td{background:#f9fafb;font-size:14px}
.gv .sh p{margin:2px 0}
.gv .pc{margin:6px 0 4px}
.gv .st{margin:0 0 6px}
.gv .st b{display:block}
.gv img{display:block;max-width:100%;height:auto;margin:4px 0;cursor:zoom-in}
.dt{border-collapse:collapse;margin:6px 0;font-size:13px}
.dt td,.dt th{border:1px solid #444;padding:3px 10px;text-align:center}
.fig{margin:4px 0}
.fig figcaption{font-size:12px;color:#555}
.paper-note{margin:0 0 10px;font-size:12px;color:var(--g500);font-family:Inter,system-ui,sans-serif}
@media (max-width:720px){
 .paper{padding:16px 14px;font-size:14px}
 .gv,.gv thead,.gv tbody,.gv tr,.gv th,.gv td{display:block;width:100%}
 .gv thead{display:none}
 .gv td{border:0;border-top:1px solid #444;padding:8px 2px}
 .gv tr{border:1px solid #444;margin:0 0 8px}
 .gv td:first-child{border-top:0}
 .gv td::before{content:attr(data-h);display:block;margin:0 0 4px;font:600 11px Inter,system-ui,sans-serif;text-transform:uppercase;color:#555}
 .gv .c1{width:100%}
 .gv .sh{border:0;margin:0}
 .gv .sh td::before{display:none}
 .gv .sh td{border-top:0;padding:8px 6px}
}
/* ---------- sheet (bottom sheet / popover) ---------- */
.scrim{display:none;position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.45)}
.scrim[data-on=true]{display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;background:#fff;padding:12px 16px 20px}
@media (min-width:721px){.scrim[data-on=true]{align-items:center}.sheet{border-radius:16px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--g300);margin:0 auto 10px}
.zoom{position:relative;height:220px;overflow:auto;border:1px solid var(--g200);border-radius:8px;background:var(--g50);touch-action:pinch-zoom pan-x pan-y}
.zoom img{display:block;margin:0 auto;max-width:100%;transform-origin:top left}
.zoom.z2 img{max-width:none;width:200%}
.seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--g100)}
.seg button{flex:1;min-height:44px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:500;color:var(--g600)}
.seg button[aria-pressed=true]{background:#fff;color:var(--g900);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

  if(s==='exporting') d={k:'',r:'status',ic:SPIN,t:'Đang tạo file Word…',s:'File sẽ tải về khi xong.',a:''};
  if(s==='exported') d={k:'ok',r:'status',ic:OKI,t:'Đã xuất giao-an-bieu-do-cot.docx',s:'Chưa thấy file? Bấm Tải lại.',a:'<button class="btn btn-s" type="button" data-redl>Tải lại</button><button class="btn btn-s" type="button" data-dismiss aria-label="Đóng">'+XI+'</button>'};
  if(s==='export-error') d={k:'err',r:'alert',ic:WARN,t:'Chưa xuất được file Word',s:'Chưa có file để tải. Bấm Thử lại.',a:rbtn('data-retry="export"')};
  if(!d) return '';
  return '<div class="dock '+d.k+'" id="dock" role="'+d.r+'" aria-live="'+(d.r==='alert'?'assertive':'polite')+'" tabindex="-1"><span class="ic">'+d.ic+'</span><div class="dk-t"><b>'+d.t+'</b><span>'+d.s+'</span></div><div class="dk-a">'+d.a+'</div></div>';
}
function upHtml(){
  if(S.state==='uploading') return '<div class="uprow" role="status"><span class="th skl"></span><div class="tx"><b>bieu-do-minh-hoa.svg</b>Đang tải lên 62%<div class="pbar det" style="margin-top:6px"><i style="width:62%"></i></div></div><button class="btn btn-s" type="button" data-stop>Dừng</button></div>';
  if(S.state==='upload-error') return '<div class="uprow err" role="alert" tabindex="-1" id="msg"><span class="th skl"></span><div class="tx"><b>Chưa tải được hình</b>Hình chưa được thêm vào giáo án. Bấm Thử lại.</div>'+rbtn('data-retry="upload"')+'</div>';

/* ---- live simulation (?live=1) ---- */
var TM=[],ELA=null;
function later(fn,ms){var id=setTimeout(fn,ms);TM.push(id);return id}
function clearT(){TM.forEach(clearTimeout);TM=[];clearInterval(ELA);ELA=null}
function tick(){S.t=0;clearInterval(ELA);ELA=setInterval(function(){S.t++;var e=document.getElementById('elapsed');if(e)e.textContent=fmt(S.t);if(S.state==='generating'&&S.t===60){S.state='generating-long';render()}},1000)}
var FAIL=Q.get('fail')==='1',DLY=+(Q.get('delay')||1400);
function liveList(){clearT();S.view='list';S.state='wait';S.waitS=0;render();var shown=0;
  later(function(){if(S.state==='wait'){S.state='loading';shown=Date.now();render()}},300);
  later(function(){if(S.state==='loading'){S.state='loading-long';S.waitS=8;render()}},8000);
  later(function(){if(S.state==='loading-long'){S.waitS=15;render()}},15000);
  later(function(){if(S.state==='loading'||S.state==='loading-long'){S.state='error';render()}},30000);
  later(function(){var fin=function(){S.state=FAIL?'error':'ready';render()};
    if(S.state==='loading'||S.state==='loading-long'){var rem=500-(Date.now()-shown);rem>0?later(fin,rem):fin()}else if(S.state==='wait')fin()},DLY)}
function liveOpen(){clearT();S.state='row-opening';render();later(function(){S.view='';S.tab='soan';S.state='opening';render()},300);later(function(){S.state=FAIL?'opening-error':'';render()},300+Math.max(500,DLY))}
function liveExport(){clearT();S.view='';S.state='exporting';render();later(function(){S.state=FAIL?'export-error':'exported';render()},2500)}
function liveRevise(){clearT();S.state='revising';tick();render();later(function(){S.state=FAIL?'revise-error':'';render()},9000)}
function liveGen(){clearT();S.view='';S.state='generating';tick();render();later(function(){S.state=FAIL?'generating-error':'opening';render();if(!FAIL)later(function(){S.state='';render();scrollTo(0,0)},900)},10000)}
function liveCreate(){clearT();S.view='create';S.state='busy';render();later(function(){liveGen()},1200)}

/* ======================= create form ======================= */
function createHtml(){
  var t=typeOf();
  var h='<h1 style="margin:0 0 4px;font-size:22px;color:var(--g900)">Tạo giáo án mới</h1><p class="hint" style="margin:0 0 14px">Toán lớp 6–9 · theo khung Phụ lục IV · GV tự thẩm định</p>';
  h+='<section class="card"><span class="lb" id="gl">Lớp</span><div class="gchips" role="group" aria-labelledby="gl">'+[6,7,8,9].map(function(g){return '<button type="button" class="gch" data-cgrade="'+g+'" aria-pressed="'+(S.cgrade===g)+'">'+g+'</button>'}).join('')+'</div>';
  h+='<label class="lb" for="ct">Tên bài</label><input class="inp" id="ct" value="'+esc(S.ctitle)+'"/>';
  h+='<div class="two"><div><label class="lb" for="cn">Số tiết</label><input class="inp" id="cn" type="number" inputmode="numeric" value="1"/></div><div><label class="lb" for="cm">Phút mỗi tiết</label><input class="inp" id="cm" type="number" inputmode="numeric" value="45"/></div></div>';
  h+='<span class="lb" id="tl">Loại bài</span><div class="cards" role="radiogroup" aria-labelledby="tl">'+TYPES.map(function(x){var on=x.id===S.type;return '<button type="button" class="tcard" role="radio" aria-checked="'+on+'" data-ctype="'+x.id+'"><span class="rd">'+CHK+'</span>'+esc(x.name)+'</button>'}).join('')+'</div>';
  h+='<p class="thelp" id="thelp">'+esc(t.help)+'</p>';
  h+=''+(S.state==='error'?'<div class="msg" id="msg" role="alert" tabindex="-1" style="margin-top:14px"><b>Chưa tạo được giáo án</b><span>Chưa mở editor. Bấm Tạo giáo án để thử lại.</span></div>':'')+'<div class="acts"><button class="btn btn-p" type="button" '+(S.state==='busy'?'disabled aria-busy="true">'+SPIN+'Đang tạo…':'data-create>Tạo giáo án')+'</button></div></section>';
  h+='<div class="propbox tprop"><b>Khác nhau theo loại bài trong editor</b><span class="prop">Đề xuất – chờ duyệt</span><p>Đổi hợp đồng và prompt Toán đang đóng băng, chưa duyệt schema. Tên 4 hoạt động giữ nguyên.</p><ul>'+TYPES.map(function(x){return '<li'+(x.id===S.type?' class="on"':'')+'><b>'+esc(x.name)+'</b><span>'+esc(x.change)+'</span></li>'}).join('')+'</ul></div>';
  return h;
}
/* ======================= Word preview (cùng nội dung và thứ tự với bản Xem) ======================= */
function openWord(){
  var h='<div class="grab"></div><h3 class="sec-h">Xem trước Word<button class="btn btn-s" data-close type="button">Đóng</button></h3><p class="hint" style="margin:0 0 6px">Cùng nội dung và thứ tự với bản Xem.</p>';

/* ======================= render ======================= */
function render(){
  fid=0;
  document.body.classList.toggle('cur',S.cur);
  var LV=S.view==='list',GV=!LV&&S.view!=='create'&&GENS.indexOf(S.state)>=0,OV=!LV&&!GV&&S.view!=='create'&&(S.state==='opening'||S.state==='opening-error');
  document.body.classList.toggle('create',S.view==='create'||LV||GV);
  document.body.classList.toggle('still',!S.live);document.body.classList.toggle('rm',S.rm);
  document.getElementById('bar').className=LV?'bar lbar':'bar';
  document.getElementById('bar').innerHTML=LV?listBar():barHtml();
  document.getElementById('rail').innerHTML=OV?railSkel():railHtml();
  document.getElementById('chips').innerHTML=OV?chipsSkel():chipsHtml();
  var tabs='<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="soan" aria-selected="'+(S.tab==='soan')+'">Soạn</button><button class="tab" role="tab" data-tab="xem" aria-selected="'+(S.tab==='xem')+'">Xem như giáo án</button><button class="tab" role="tab" '+(S.state==='compare-loading'||S.tab==='cmp'?'data-tab="cmp" aria-selected="'+(S.tab==='cmp')+'"':'disabled')+'>So sánh</button></div>';
  var body=LV?listHtml():S.view==='create'?createHtml():GV?genHtml():OV?openingHtml():((S.cur?'':tabs)+(S.tab==='cmp'?cmpSkel():S.tab==='xem'&&!S.cur?(S.state==='xem-loading'?xemSkel():viewHtml()):soanHtml()));
  document.getElementById('doc').innerHTML=body;
  var dk=document.getElementById('dockw');if(!dk){dk=document.createElement('div');dk.id='dockw';document.body.appendChild(dk)}
  dk.innerHTML=(LV||GV||OV||S.view==='create')?'':dockHtml();
  if(S.state==='revising'||(S.view==='create'&&S.state==='busy')){document.querySelectorAll('#doc .ta,#doc .inp').forEach(function(e){if(S.state==='revising'){e.readOnly=true;e.setAttribute('aria-readonly','true')}else e.disabled=true});if(S.state==='busy')document.querySelectorAll('#doc .gch,#doc .tcard').forEach(function(e){e.disabled=true})}
  if(/error|timeout/.test(S.state||'')&&S.state!=='upload-error'){var fm=document.getElementById('msg')||document.getElementById('dock');if(fm)fm.focus({preventScroll:true})}
  growAll();
  var sb=document.getElementById('symbar');
  var kh=innerWidth>=1100?398:innerWidth>=700?314:291;
  document.documentElement.style.setProperty('--kbd',kh+'px');
  document.getElementById('kbd').style.height=kh+'px';
  sb.style.bottom=kh+'px';
  sb.innerHTML=['⋮','$\\ndiv$','∈','∉','ℕ','⊂','≤','≥','≠','×','÷','→','°','∠','⊥','∥','π','√'].map(function(k){return '<button class="sk" type="button" data-ins="'+esc(k)+'" aria-label="Chèn ký hiệu">'+(k==='$\\ndiv$'?'<span class="ndv">⋮</span>':esc(k))+'</button>'}).join('')+'<span class="symsep"></span><button class="sk w" type="button" data-ins="$\\frac{ }{ }$">a/b</button><button class="sk w" type="button" data-ins="$x^{ }$">xⁿ</button>';
  document.body.classList.toggle('kbd-on',S.kbd);
}
function growAll(){document.querySelectorAll('.ta').forEach(function(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,S.cur?72:44)+'px'})}
addEventListener('resize',growAll);
document.addEventListener('input',function(e){if(e.target.dataset&&e.target.dataset.hvi!==undefined)S.hvnItems[+e.target.dataset.hvi]=e.target.value;if(e.target.classList.contains('ta')){e.target.style.height='auto';e.target.style.height=(e.target.scrollHeight+2)+'px'}});
/* ======================= interactions ======================= */
function go(id){
  var m=/^act-(\d)/.exec(id);
  if(m&&!S.cur){S.open=+m[1];var sm=/-sub-(\d)/.exec(id);if(sm)S.sub=+sm[1];S.tab='soan';render()}
  var el=document.getElementById(id);if(el){el.scrollIntoView({block:'start',behavior:'auto'})}
  closeSheet();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],[data-sub],[data-step],[data-tab],[data-img],[data-addimg],[data-ins],[data-word],[data-hv-add],[data-hv-del],[data-hv-rm],[data-hv-on],[data-ctype],[data-cgrade],[data-create],[data-create-new],[data-retry],[data-tolist],[data-tocreate],[data-revise],[data-row],[data-redl],[data-dismiss],[data-doexport],[data-stop],#tocbtn,.save-retry,[data-close],[data-size],[data-z],[data-info]');
  if(!t) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.act!==undefined){var i=+t.dataset.act;S.open=S.open===i?-1:i;var y=scrollY;render();return}
  if(t.dataset.sub!==undefined){S.sub=S.sub===+t.dataset.sub?-1:+t.dataset.sub;render();return}
  if(t.dataset.step){S.steps[t.dataset.step]=true;render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();scrollTo(0,0);return}
  if(t.dataset.img) return openImg(t.dataset.img);
  if(t.dataset.addimg!==undefined) return openImg(null);
  if(t.dataset.word!==undefined) return openWord();
  if(t.dataset.hvAdd!==undefined){S.hvnItems.push('');S.open=4;render();var ta=document.querySelectorAll('[data-hvi]');ta[ta.length-1].focus();return}
  if(t.dataset.hvDel!==undefined){S.hvnItems.splice(+t.dataset.hvDel,1);S.open=4;render();return}
  if(t.dataset.hvRm!==undefined){S.hvnSaved=S.hvnItems.slice();S.hvn=false;render();return}
  if(t.dataset.hvOn!==undefined){S.hvn=true;S.hvnItems=S.hvnSaved.length?S.hvnSaved.slice():[''];S.open=4;render();return}
  if(t.dataset.ctype){S.type=t.dataset.ctype;render();return}
  if(t.dataset.cgrade){S.cgrade=+t.dataset.cgrade;render();return}
  if(t.dataset.createNew!==undefined){S.view='create';S.state='';render();scrollTo(0,0);return}
  if(t.dataset.tolist!==undefined){S.view='list';S.state='ready';if(S.live)liveList();else render();return}
  if(t.dataset.tocreate!==undefined){S.view='create';S.state='';render();return}
  if(t.dataset.row!==undefined){if(S.live)liveOpen();return}
  if(t.dataset.revise!==undefined){if(S.live)liveRevise();return}
  if(t.dataset.doexport!==undefined){closeSheet();if(S.live)liveExport();return}
  if(t.dataset.dismiss!==undefined){S.state='';render();return}
  if(t.dataset.stop!==undefined){if(S.live){clearT();S.state='';if(S.view==='')render();else{S.view='list';liveList()}}return}
  if(t.dataset.redl!==undefined){return}
  if(t.dataset.retry!==undefined){if(!S.live)return;var rk=t.dataset.retry;if(rk==='list')liveList();else if(rk==='open')liveOpen();else if(rk==='export')liveExport();else if(rk==='revise')liveRevise();else if(rk==='gen')liveGen();return}
  if(t.dataset.create!==undefined){if(S.live)return liveCreate();S.view='';S.tab='soan';render();scrollTo(0,0);return}
  if(t.id==='tocbtn') return openToc();
  if(t.classList.contains('save-retry')){ var f=document.querySelector('[aria-invalid=true]'); if(f&&S.save==='data'){f.focus();} return}
  if(t.dataset.info!==undefined){S.info=!S.info;render();return}
  if(t.dataset.close!==undefined) return closeSheet();
  if(t.dataset.size!==undefined){document.querySelectorAll('[data-size]').forEach(function(b){b.setAttribute('aria-pressed',b===t)});return}
  if(t.dataset.z!==undefined){document.querySelector('.zoom').classList.toggle('z2');return}
  if(t.dataset.ins){var ta=document.activeElement;if(ta&&ta.classList&&ta.classList.contains('ta')){ta.setRangeText(t.dataset.ins.replace(/\$/g,'$'),ta.selectionStart,ta.selectionEnd,'end')}return}
});

    h+='<label class="lb">Cỡ hình khi xuất</label><div class="seg"><button type="button" data-size aria-pressed="false">Nhỏ</button><button type="button" data-size aria-pressed="true">Vừa</button><button type="button" data-size aria-pressed="false">Rộng</button></div>';
    h+='<div class="sh-acts" style="grid-template-columns:1fr 1fr"><button class="btn" type="button" style="color:#991b1b">Xoá hình</button><button class="btn btn-p" type="button" data-close>Lưu</button></div>';
  } else h+='<div class="sh-acts" style="grid-template-columns:1fr"><button class="btn btn-p" type="button" data-close>Lưu</button></div>';
  document.getElementById('sheet').innerHTML=h;document.getElementById('scrim').dataset.on='true';
}
/* scroll spy */
function spy(){
  var ids=tocItems().filter(function(x){return !x.sub&&x.sub!==0}).map(function(x){return x.id});
  var cur=ids[0];ids.forEach(function(id){var el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<140)cur=id});
  document.querySelectorAll('.ri').forEach(function(b){b.classList.toggle('on',b.dataset.go===cur)});
  document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.go===cur)});
}
addEventListener('scroll',spy,{passive:true});
render();spy();
if(Q.get('scroll')){var el=document.getElementById(Q.get('scroll'));if(el)el.scrollIntoView({block:'start'});}
if(Q.get('focus')){var f=document.querySelector(Q.get('focus'));if(f){f.focus();}}
if(Q.get('img')){openImg(Q.get('img'))}
if(Q.get('add')||S.state==='uploading'||S.state==='upload-error'){openImg(null)}
if(S.live&&S.view==='list'&&S.state==='ready'||S.live&&!Q.get('view')){liveList()}
if(Q.get('word')){openWord()}
if(Q.get('toc')){openToc()}
