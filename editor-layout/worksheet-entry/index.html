<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tab Phiếu bài tập · GiaoAn AI — mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--blue:#2563eb;--blue-h:#1d4ed8;--blue-s:#eff6ff;--blue-b:#bfdbfe;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;--green:#059669;--gs:#ecfdf5;--gb:#a7f3d0;--amber:#d97706}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--g50);color:var(--g800);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;touch-action:manipulation}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.proto{position:sticky;top:0;z-index:60;background:#1f2937;color:#e5e7eb;padding:8px 12px;font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.proto button{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid #4b5563;background:#374151;color:#fff;font-size:12px}.proto button[aria-pressed=true]{background:var(--blue)}
html.bare .proto{display:none}
.top{position:sticky;top:0;z-index:40;height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--g200);font-size:14px}
.top .b{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}.logo{width:24px;height:24px;border-radius:6px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.crumb{color:var(--g500);overflow:hidden;text-overflow:ellipsis}.crumb a{color:var(--blue)}
.top .r{display:flex;gap:14px;align-items:center;color:var(--g700);font-weight:500;white-space:nowrap;flex:none}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--g300);background:#fff;color:var(--g800);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-o{border-color:var(--blue-b);color:var(--blue-h);background:var(--blue-s)}
.mlc{display:none}
@media(max-width:1099px){.mlc{display:inline}}
@media(max-width:720px){.crumb,.back-t,.brand-t{display:none}.top .r{gap:10px}.btn{padding:0 10px;font-size:13px}}
.wrap{display:flex}aside{display:none;width:236px;flex:none;background:#fff;border-right:1px solid var(--g200);padding:16px 12px;min-height:calc(100vh - 48px)}
@media(min-width:1100px){aside{display:block}}
aside .t{font-size:13px;color:var(--g700);padding:6px 8px;border-radius:6px}aside .t.on{background:var(--g100);font-weight:600}aside .t.s{font-size:11px;color:var(--g500);padding-left:16px}
aside .t.ws{margin-top:8px;border-top:1px solid var(--g200);padding-top:12px;color:var(--blue-h);font-weight:600}
main{flex:1;min-width:0;max-width:860px;margin:0 auto;padding:8px 36px 64px}@media(max-width:720px){main{padding:8px 12px 120px}}
.tabs{display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap}.tab{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--g200);background:#fff;color:var(--g600);font-size:14px;font-weight:500}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab .n{margin-left:6px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;background:var(--gs);color:#047857}
.chips{position:sticky;top:48px;z-index:20;display:flex;gap:8px;overflow-x:auto;background:var(--g50);padding:4px 0;margin:0 0 8px}@media(min-width:1100px){.chips{display:none}}
.chip{min-height:44px;flex:none;border-radius:999px;border:1px solid var(--g200);background:#fff;padding:0 12px;font-size:13px;color:var(--g700)}.chip.on{border-color:var(--g900);font-weight:600}
.chip.ws{border-color:var(--blue-b);background:var(--blue-s);color:var(--blue-h);font-weight:600}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 12px;font-size:13px;color:var(--g500)}
.v{border-radius:4px;background:var(--g100);padding:2px 8px;font-size:12px;font-weight:600;color:var(--g700)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px 1px 7px;font-size:12px;font-weight:600;color:var(--g700);border:1px solid var(--gb);background:var(--gs)}.pill i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:16px;margin:0 0 14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;flex-wrap:wrap}.hd h2{margin:0;font-size:16px;font-weight:600;color:var(--g900)}
.ptitle{margin:0 0 12px;font-size:14px;color:var(--g700)}.ptitle b{color:var(--g900)}
.sec{margin:0 0 14px}.sec .l{font-size:14px;font-weight:700;color:var(--g900);margin:0 0 6px}
.f{height:40px;border-radius:8px;border:1px solid var(--g200);background:#fff;margin:0 0 8px;position:relative}.f::after{content:"";position:absolute;left:12px;top:15px;height:10px;width:60%;border-radius:4px;background:var(--g100)}
.act{border-top:1px solid var(--g200);padding:12px 0 4px;display:flex;justify-content:space-between;align-items:center}.act b{font-size:14px}.act span{font-size:13px;color:var(--g500)}
.act.hl{background:var(--blue-s);margin:0 -16px;padding:12px 16px;border-top-color:var(--blue-b)}
.inl{margin:6px 0 14px;padding:12px 14px;border:1px dashed var(--blue-b);background:var(--blue-s);border-radius:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.inl p{margin:0;font-size:14px;color:var(--g700)}.inl p b{color:var(--g900)}
.hint{font-size:13px;color:var(--g500);margin:0}
.empty{text-align:left;padding:8px 0}.empty h3{margin:0 0 4px;font-size:16px;color:var(--g900)}.empty p{margin:0 0 14px;font-size:14px;color:var(--g700)}
.empty ul{margin:0 0 16px;padding-left:18px;font-size:14px;color:var(--g700)}
.q{border-top:1px solid var(--g200);padding:10px 0}.q:first-child{border-top:0}.q b{font-size:14px}
.revise{margin-top:8px;font-size:14px;color:var(--g700)}.ta{height:72px;border:1px solid var(--g200);border-radius:8px;margin:6px 0 10px;background:#fff}
.lbl{position:fixed;right:8px;bottom:8px;z-index:70;background:rgba(17,24,39,.85);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}html:not(.bare) .lbl{display:none}
.mark{outline:3px solid #f59e0b;outline-offset:3px;border-radius:10px}html:not(.mk) .mark{outline:0}

/* ---- B final: segmented tabs ---- */
.tabs{display:flex;gap:8px;margin:0 0 8px;flex-wrap:nowrap}
.tab{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab .s{display:none}
.tab .n{margin-left:0;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;min-width:18px;line-height:18px;background:#fff;color:var(--blue-h);border:1px solid var(--blue-b)}
.tab[aria-selected=false] .n{background:var(--blue-s)}
.tab .gd{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.tab .gd{animation:none}}
@media(max-width:480px){
 .tabs{gap:0;padding:2px;border:1px solid var(--g200);border-radius:10px;background:#fff}
 .tab{flex:1 1 0;min-width:0;padding:0 4px;border:0;border-radius:8px;font-size:13px}
 .tab .l{display:none}.tab .s{display:inline}
}
.ws-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 6px}.ws-hd h2{margin:0;font-size:16px;font-weight:600;color:var(--g900)}
.note{margin:12px 0 0;font-size:13px;color:var(--g500)}
.err{margin:0 0 14px;padding:12px 14px;border:1px solid #fecaca;background:#fef2f2;border-radius:10px;font-size:14px;color:var(--g800);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.err b{color:var(--red,#dc2626)}
.stale{margin:0 0 14px;padding:12px 14px;border:1px solid #fde68a;background:#fffbeb;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.run{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--blue-b);background:var(--blue-s);border-radius:10px;font-size:14px;font-weight:600;color:var(--blue-h);margin:0 0 12px}
.spin{width:16px;height:16px;border:2px solid var(--blue-b);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.sk{height:14px;border-radius:4px;background:var(--g100);margin:10px 0}
</style></head><body>
<div class="proto"><span>Trạng thái:</span><span id="sB"></span><span>|</span><span>Tab:</span><span id="tB"></span></div>
<header class="top"><div class="b"><span class="mlc">Mục lục</span><span class="logo" aria-hidden="true">G</span><b class="brand-t">GiaoAn AI</b><span class="crumb">/ <a>Giáo án</a> / Định lí minh họa</span></div>
<div class="r"><button class="btn btn-p" type="button">Xuất Word</button><span class="back-t">← Về danh sách</span><span>Đăng xuất</span></div></header>
<div class="wrap"><aside aria-label="Mục lục" id="side"></aside><main id="m"></main></div>
<div class="lbl" id="lbl"></div>
<script>
var Q=new URLSearchParams(location.search);
var ST={empty:'Chưa có phiếu',generating:'Đang tạo',ready:'Đã có phiếu',error:'Lỗi tạo',stale:'Giáo án đã sửa',blocked:'Chưa lưu được'};
var state=ST[Q.get('state')]?Q.get('state'):'empty',tab=Q.get('tab')==='soan'?'soan':'ws';
if(Q.get('bare')==='1')document.documentElement.classList.add('bare');
var N=6,TOC=['Thông tin bài dạy','I. Mục tiêu','II. Thiết bị dạy học và học liệu','III. Tiến trình dạy học','1. Mở đầu','2. Hình thành kiến thức mới','3. Luyện tập','4. Vận dụng'];
function T(id,l,s,sel,extra,aria){return '<button class="tab" role="tab" id="tab-'+id+'" aria-controls="panel-'+id+'" aria-selected="'+sel+'" tabindex="'+(sel?0:-1)+'"'+(aria?' aria-label="'+aria+'"':'')+'><span class="l">'+l+'</span><span class="s" aria-hidden="true">'+s+'</span>'+(extra||'')+'</button>'}
function tabs(){var has=state==='ready'||state==='stale',gen=state==='generating';
 var badge=has?'<span class="n" aria-hidden="true">'+N+'</span>':gen?'<span class="gd" aria-hidden="true"></span>':'';
 var aria='Phiếu bài tập'+(has?', '+N+' câu':gen?', đang tạo':'');
 return '<div class="tabs" role="tablist" aria-label="Chế độ xem">'+T('soan','Soạn','Soạn',tab==='soan','','Soạn')+T('xem','Xem như giáo án','Xem',false,'','Xem như giáo án')+T('diff','So sánh','So sánh',false,'','So sánh')+T('ws','Phiếu bài tập','Phiếu',tab==='ws',badge,aria)+'</div>'}
function chips(){return '<div class="chips">'+TOC.map(function(x,i){return '<button class="chip'+(i?'':' on')+'">'+x+'</button>'}).join('')+'</div>'}
function f(n){var s='';for(var i=0;i<n;i++)s+='<div class="f"></div>';return s}
function soan(){return chips()+'<section class="card" role="tabpanel" id="panel-soan" aria-labelledby="tab-soan"><div class="hd"><h2>Giáo án (Phụ lục IV)</h2></div><p class="ptitle"><b>Định lí minh họa</b> — lớp 8 — 45 phút — phiên bản 11</p><div class="sec"><p class="l">Thông tin bài dạy</p>'+f(2)+'</div><div class="sec"><p class="l">I. Mục tiêu</p>'+f(3)+'</div><div class="sec"><p class="l">III. Tiến trình dạy học</p>'+f(2)+'</div><p class="revise">Yêu cầu soạn lại</p><div class="ta"></div><button class="btn" type="button">Soạn lại giáo án</button></section>'}
function qs(){var s='';for(var i=1;i<=3;i++)s+='<div class="q"><b>Câu '+i+'</b><div class="sk" style="width:90%"></div><div class="sk" style="width:60%"></div></div>';return s+'<p class="hint">… còn '+(N-3)+' câu</p>'}
function sheet(){return '<div class="ws-hd"><h2>Phiếu bài tập · '+N+' câu</h2><span class="hint">Tạo lúc 08:41 · từ giáo án v11</span></div>'+qs()+'<p class="revise">Yêu cầu soạn lại phiếu</p><div class="ta"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button">Soạn lại phiếu</button></div><p class="note">Xuất Word gồm giáo án và phiếu này (kèm gợi ý đáp án).</p>'}
function empty(msg){return '<div class="empty"><h3>Chưa có phiếu bài tập</h3><p>GiaoAn AI soạn phiếu từ Luyện tập và Vận dụng của giáo án này.</p>'+(msg||'')+'<button class="btn btn-p" type="button">Tạo phiếu bài tập</button><p class="note">Giáo án được lưu trước khi tạo phiếu.</p></div>'}
function ws(){var h='<section class="card" role="tabpanel" id="panel-ws" aria-labelledby="tab-ws" tabindex="-1">';
 if(state==='empty')h+=empty();
 if(state==='blocked')h+='<div class="err" role="alert"><span>Chưa lưu được giáo án nên chưa tạo phiếu. Sửa các ô báo đỏ ở tab Soạn.</span><button class="btn" type="button">Về tab Soạn</button></div>'+empty();
 if(state==='generating')h+='<div class="run" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span>Đang tạo phiếu bài tập · thường dưới 1 phút</div><div class="sk" style="width:70%"></div><div class="sk"></div><div class="sk" style="width:85%"></div><p class="note">Có thể chuyển tab khác, phiếu xong sẽ hiện ở đây.</p>';
 if(state==='error')h+='<div class="err" role="alert"><span><b>Chưa tạo được phiếu.</b> Thử lại.</span><button class="btn btn-p" type="button">Thử lại</button></div><p class="hint">Giáo án không bị ảnh hưởng.</p>';
 if(state==='ready')h+=sheet();
 if(state==='stale')h+='<div class="stale" role="status"><span>Giáo án đã sửa sau khi tạo phiếu.</span><button class="btn btn-o" type="button">Tạo lại phiếu</button></div>'+sheet();
 return h+'</section>'}
function render(){var sd=TOC.map(function(x,i){return '<div class="t'+(i===0?' on':'')+(i>3?' s':'')+'">'+x+'</div>'}).join('');document.getElementById('side').innerHTML=sd;
 document.getElementById('m').innerHTML=tabs()+'<p class="meta"><span class="v">v11</span><span class="pill"><i></i>Đã soạn</span><span>Theo khung Phụ lục IV · GV tự thẩm định trước khi nộp.</span></p>'+(tab==='ws'?ws():soan());
 document.getElementById('lbl').textContent='B · '+ST[state]+(tab==='soan'?' · tab Soạn':'');
 [].forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){var id=b.id.slice(4);if(id==='ws'||id==='soan'){tab=id;set('tab',id);render();var p=document.getElementById('tab-'+id);p&&p.focus()}}});
 document.querySelector('[role=tablist]').onkeydown=function(e){var t=[].slice.call(this.querySelectorAll('.tab')),i=t.indexOf(document.activeElement);if(i<0)return;var j=e.key==='ArrowRight'?(i+1)%t.length:e.key==='ArrowLeft'?(i+t.length-1)%t.length:e.key==='Home'?0:e.key==='End'?t.length-1:-1;if(j>=0){e.preventDefault();t[j].focus()}};
 bar()}
function set(k,v){var u=new URL(location.href);u.searchParams.set(k,v);history.replaceState(null,'',u)}
function bar(){var s=document.getElementById('sB'),t=document.getElementById('tB');s.innerHTML='';t.innerHTML='';Object.keys(ST).forEach(function(k){var b=document.createElement('button');b.textContent=ST[k];b.setAttribute('aria-pressed',k===state);b.onclick=function(){state=k;set('state',k);render()};s.appendChild(b)});
 [['soan','Soạn'],['ws','Phiếu']].forEach(function(p){var b=document.createElement('button');b.textContent=p[1];b.setAttribute('aria-pressed',p[0]===tab);b.onclick=function(){tab=p[0];set('tab',tab);render()};t.appendChild(b)})}
render();
</script></body></html>
