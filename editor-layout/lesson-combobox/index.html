function pick(i){var x=items[i];t.value=x[3];picked=x;close();setHint('');go.disabled=false;st.textContent='Đã chọn '+x[3]+'.'}
t.addEventListener('input',function(){render()});t.addEventListener('focus',function(){if(t.value)render()});
t.addEventListener('keydown',function(e){var open=!lb.hidden,n=items.length;
 if(e.key==='ArrowDown'){e.preventDefault();if(!open){render();return}setAct((act+1)%n)}
 else if(e.key==='ArrowUp'){e.preventDefault();if(open)setAct(act<=0?n-1:act-1)}
 else if(e.key==='Enter'){if(open&&act>=0){e.preventDefault();pick(act)}}
 else if(e.key==='Escape'){if(open){e.preventDefault();e.stopPropagation();close()}}});
lb.addEventListener('mousedown',function(e){e.preventDefault()});lb.addEventListener('click',function(e){var o=e.target.closest('.opt');if(o)pick(+o.dataset.i)});
t.addEventListener('blur',function(){setTimeout(close,100)});
k.addEventListener('change',function(){t.placeholder=k.value?'Ví dụ: '+PH[k.value]:'Ví dụ: Phân thức đại số';render();if(!lb.hidden)close()});
if(window.visualViewport)visualViewport.addEventListener('resize',function(){if(!lb.hidden)fit()});
var S={a:'a · có gợi ý',b:'b · không khớp',c:'c · chưa chọn Khối',d:'d · đổi Khối sau khi chọn'};var u=new URL(location.href),s=u.searchParams.get('state')||'a';
if(u.searchParams.get('kb')){document.documentElement.style.setProperty('--kbh','300px');document.getElementById('kb').classList.add('on')}
var pb=document.getElementById('pb');Object.keys(S).forEach(function(key){var b=document.createElement('button');b.textContent=S[key];b.setAttribute('aria-pressed',key===s);b.onclick=function(){u.searchParams.set('state',key);location.href=u};pb.appendChild(b)});
var kbb=document.createElement('button');kbb.textContent='bàn phím';kbb.setAttribute('aria-pressed',!!u.searchParams.get('kb'));kbb.onclick=function(){if(u.searchParams.get('kb'))u.searchParams.delete('kb');else u.searchParams.set('kb','1');location.href=u};pb.appendChild(kbb);
function setK(g){k.value=g;t.placeholder=g?'Ví dụ: '+PH[g]:'Ví dụ: Phân thức đại số'}
if(u.searchParams.get('bare')!=='0'){t.focus();
 if(s==='a'){setK('7');t.value='goc';render();setAct(0)}
 if(s==='b'){setK('8');t.value='Ôn tập hình học trực quan';render()}
 if(s==='c'){setK('');t.value='phan so';render()}
 if(s==='d'){setK('7');t.value='tong cac goc';render();pick(0);setK('8');render();t.blur()}}
</script></body></html>
